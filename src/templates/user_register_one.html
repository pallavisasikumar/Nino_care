{% extends "reg_index.html" %}
{% block body %}
<head>
    <meta charset="UTF-8">
    <title>User Register</title>
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <!-- Bootstrap CSS -->
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Custom form styling */
        body {
            background-color: #f7f7f7;
            font-family: 'Arial', sans-serif;
        }
        .form-container {
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background-color: #ffffff;
            box-shadow: 0px 0px 15px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
        }
        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #343a40;
        }
        .table th, .table td {
            vertical-align: middle;
        }
        .btn-primary {
            width: 100%;
            padding: 10px;
            font-size: 16px;
        }
        select {
            height: 40px;
        }
    </style>
</head>
<body>

<div class="form-container">
    <h2>User Registration</h2>
    <form action="user_registration#about" method="post">
        <table class="table table-borderless">
            <tr>
                <th>District</th>
                <td>
                    <select name="dist" id="district" class="form-control" required>
                        <option value="">Select District</option>
                        <option>Kasargod</option>
                        <option>Kannur</option>
                        <option>Wayanad</option>
                        <option>Kozhikode</option>
                        <option>Malappuram</option>
                        <option>Palakkad</option>
                        <option>Thrissur</option>
                        <option>Ernakulam</option>
                        <option>Idukki</option>
                        <option>Kottayam</option>
                        <option>Alappuza</option>
                        <option>Pathanamthitta</option>
                        <option>Kollam</option>
                        <option>Thiruvananthappuram</option>
                    </select>
                </td>
            </tr>

            <tr>
                <th>Taluk</th>
                <td>
                    <select name="taluk" id="taluk" class="form-control" required>
                        <option value="">Select Taluk</option>
                        <!-- Taluks will be dynamically populated -->
                    </select>
                </td>
            </tr>

            <tr>
                <th>Panchayath</th>
                <td>
                    <select name="select" id="panchayath" class="form-control" required>
                        <option value="">Select Panchayath</option>
                        <!-- Panchayaths will be dynamically populated -->
                    </select>
                </td>
            </tr>

            <tr>
                <td colspan="2">
                    <input type="submit" value="Next" class="btn btn-primary">
                </td>
            </tr>
        </table>
    </form>
</div>

<script>
    // Populate Taluks based on the selected District
    $("#district").change(function() {
        var district = $(this).val();
        $.ajax({
            url: "/select_taluks2",
            type: "GET",
            data: { dist: district },
            success: function(data) {
                $("#taluk").empty().append('<option value="">Select Taluk</option>');
                $.each(data, function(index, item) {
                    $("#taluk").append('<option value="'+item.taluk_name+'">'+item.taluk_name+'</option>');
                });
            }
        });
    });

    // Populate Panchayaths based on the selected Taluk
    $("#taluk").change(function() {
        var district = $("#district").val();
        var taluk = $(this).val();
        $.ajax({
            url: "/user_reg_filter",
            type: "POST",
            data: { dist: district, taluk: taluk },
            success: function(data) {
                $("#panchayath").empty().append('<option value="">Select Panchayath</option>');
                $.each(data, function(index, item) {
                    $("#panchayath").append('<option value="'+item.l_id+'">'+item.name+'</option>');
                });
            }
        });
    });
</script>

</body>
{% endblock %}
